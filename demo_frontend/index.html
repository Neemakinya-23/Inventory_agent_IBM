<!DOCTYPE html>
<html>
<head>
  <title>Quickmart Inventory</title>
</head>
<body>
  <div style="margin: 2em;">
    <h1>Quickmart Inventory Demo</h1>
    
    <div>
      <label>Product ID: <input id="pid" value="SKU123" /></label>
      <button onclick="fetchStock()">Get Stock</button>
      <button onclick="addStock(10)">Add +10</button>
      <button onclick="addStock(-5)">Remove -5</button>
    </div>
    
    <pre id="output"></pre>

    <script>
      async function fetchStock() {
        const pid = document.getElementById('pid').value;
        const resp = await fetch(`/api/stock?product_id=${pid}`);
        const data = await resp.json();
        document.getElementById('output').innerText = JSON.stringify(data, null, 2);
      }
      async function addStock(delta) {
        const pid = document.getElementById('pid').value;
        const resp = await fetch('/api/stock', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({product_id: pid, delta: delta})
        });
        const data = await resp.json();
        document.getElementById('output').innerText = JSON.stringify(data, null, 2);
      }
    </script>
  </div>
</body>
</html>
